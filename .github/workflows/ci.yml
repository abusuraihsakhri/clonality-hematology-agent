name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,dev]"

      - name: Compile Python sources
        run: python -m compileall -q clonality_hematology_agent agents clono_mind.py enrichment.py cli.py

      - name: Run tests
        run: python -m pytest -q

      - name: Canonical CLI smoke test
        run: |
          clonality-hematology-engine audit --case-id CI-001 --primary 10 --secondary 2 --status NORMAL
          clonality-hematology-engine batch -i sample.csv -o out_package.csv
          test -s out_package.csv
          rm out_package.csv

      - name: Legacy CLI smoke test
        run: |
          python cli.py batch -i sample.csv -o out_legacy.csv
          test -s out_legacy.csv
          rm out_legacy.csv

      - name: Check browser JavaScript syntax
        run: node --check web/app.js

      - name: Dependency vulnerability audit
        if: matrix.python-version == '3.12'
        run: python -m pip_audit
