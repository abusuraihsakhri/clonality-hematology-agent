name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "clonality_hematology_agent/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build static site
        run: |
          mkdir -p _site/clonality_hematology_agent
          cp web/index.html web/styles.css web/app.js _site/
          cp clonality_hematology_agent/__init__.py _site/clonality_hematology_agent/
          cp clonality_hematology_agent/models.py _site/clonality_hematology_agent/
          cp clonality_hematology_agent/engine.py _site/clonality_hematology_agent/
          cp clonality_hematology_agent/agents.py _site/clonality_hematology_agent/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
