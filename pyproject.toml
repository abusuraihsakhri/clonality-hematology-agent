[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clonality-hematology-engine"
version = "2.1.0"
description = "Rule-based research utility for reviewing clonality-assay metadata and workflow flags."
readme = "README.md"
authors = [{ name = "Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8,<9",
    "pip-audit>=2.7,<3",
]

[project.scripts]
clonality-hematology-engine = "clonality_hematology_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/clonality-hematology-agent"
Repository = "https://github.com/abusuraihsakhri/clonality-hematology-agent.git"

[tool.setuptools.packages.find]
include = ["clonality_hematology_agent*"]
